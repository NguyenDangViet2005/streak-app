[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure UpdateData "Run"]

[Variables]
Title=Streak Garden
Count=Loading...
Status=Connecting to server

[UpdateData]
Measure=Plugin
Plugin=RunCommand
Program=PowerShell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#CURRENTPATH#Update.ps1"
State=Hide
OutputType=UTF8
FinishAction=[!CommandMeasure ApplyData "Apply()"]
UpdateDivider=-1

[ApplyData]
Measure=Script
ScriptFile=#CURRENTPATH#Render.lua

[Timer]
Measure=Calc
Formula=Counter % 60
IfCondition=Timer = 0
IfTrueAction=[!CommandMeasure UpdateData "Run"]
IfConditionMode=1

[Background]
Meter=Shape
Shape=Rectangle 0,0,270,190,18 | Fill Color 250,248,244,245 | StrokeWidth 1 | Stroke Color 226,225,216

[Flame]
Meter=String
Text=🔥
FontFace=Segoe UI Emoji
FontSize=26
AntiAlias=1
X=20
Y=16

[TitleText]
Meter=String
Text=#Title#
FontFace=Segoe UI
FontSize=12
FontColor=70,80,60
AntiAlias=1
X=20
Y=67
W=230
H=24
ClipString=1

[CountText]
Meter=String
Text=#Count#
FontFace=Segoe UI Semibold
FontSize=27
FontColor=52,59,47
AntiAlias=1
X=20
Y=96
W=230
H=45
ClipString=1

[StatusText]
Meter=String
Text=#Status#
FontFace=Segoe UI
FontSize=9
FontColor=138,139,128
AntiAlias=1
X=20
Y=155
W=230
H=20
ClipString=1
